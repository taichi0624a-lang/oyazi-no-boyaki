<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta property="og:title" content="drop off | 映画アーカイブ">
<meta property="og:description" content="観た映画・観たい映画のパーソナルアーカイブ">
<title>drop off</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap">
<style>
  :root{
    --bg:#ffffff; --fg:#111111; --sub:#8a8a8a; --dim:#b5b5b5; --line:#ececec; --line2:#f4f4f4;
    --f:'Noto Sans JP',system-ui,sans-serif;
  }
  /* ── THEME variations ── */
  body[data-theme="ink"]{--bg:#0e0e10;--fg:#eceae6;--sub:#8f8c86;--dim:#5a5853;--line:#242427;--line2:#1a1a1c;color-scheme:dark}
  body[data-theme="cream"]{--bg:#f2ece0;--fg:#2a2317;--sub:#8a7f6a;--dim:#b2a892;--line:#e3dac8;--line2:#ebe3d4}
  body[data-theme="noir"]{--bg:#000000;--fg:#ffffff;--sub:#9a9a9a;--dim:#555555;--line:#242424;--line2:#121212;color-scheme:dark}
  body[data-theme="sea"]{--bg:#0a191e;--fg:#dcecee;--sub:#7ba3a7;--dim:#4a696d;--line:#15323a;--line2:#0f262c;color-scheme:dark}
  body[data-theme="dusk"]{--bg:#17131b;--fg:#ece5f0;--sub:#948b9f;--dim:#5d5569;--line:#2b2533;--line2:#1e1a26;color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--f);font-weight:400;line-height:1.7;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
  img{display:block;max-width:100%}
  a{color:inherit;text-decoration:none}
  .hidden{display:none!important}

  header{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .hd{display:flex;align-items:center;gap:22px;max-width:1360px;margin:0 auto;padding:18px clamp(16px,4vw,48px)}
  .logo{font-weight:700;font-size:1.3rem;letter-spacing:.01em}
  .hd nav{display:flex;gap:18px;margin-left:auto;flex-wrap:wrap}
  .hd nav button{background:none;border:none;font-family:var(--f);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--sub);cursor:pointer;padding:4px 0;position:relative;transition:color .2s}
  .hd nav button.on,.hd nav button:hover{color:var(--fg)}
  .hd nav button.on::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:1px;background:var(--fg)}

  .wrap{max-width:1360px;margin:0 auto;padding:0 clamp(16px,4vw,48px)}
  .hero{position:relative;width:100%;min-height:clamp(340px,70vh,600px);display:flex;align-items:flex-end;overflow:hidden;background:var(--bg)}
  #hero-bg,#hero-bg2{position:absolute;inset:0;background-size:cover;background-position:center 30%;opacity:0;transition:opacity 1.2s ease}
  #hero-bg.on,#hero-bg2.on{opacity:1}
  .hero-scrim{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 1s ease;background:linear-gradient(to top,rgba(0,0,0,.82),rgba(0,0,0,.12) 52%,rgba(0,0,0,.28))}
  .hero.has-image .hero-scrim{opacity:1}
  .hero-inner{position:relative;z-index:3;width:100%;max-width:1360px;margin:0 auto;padding:clamp(40px,7vw,78px) clamp(16px,4vw,48px) clamp(28px,4vw,46px)}
  .hero .k{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--sub);margin-bottom:18px;transition:color .4s}
  .hero.has-image .k{color:rgba(255,255,255,.75)}
  .hero-mark{font-weight:300;font-size:clamp(3.2rem,11vw,7rem);line-height:.9;letter-spacing:-.03em;margin:0;transition:color .4s}
  .hero.has-image .hero-mark{color:#fff;text-shadow:0 2px 30px rgba(0,0,0,.45)}
  .hero.has-image{cursor:pointer}
  .hero.has-image .hf-title{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px;text-decoration-color:rgba(255,255,255,.4)}
  #hero-feature{display:none;margin-top:24px}
  .hero.has-image #hero-feature{display:block}
  .hf-label{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-bottom:9px}
  .hf-title{font-size:clamp(1.1rem,2.6vw,1.7rem);font-weight:500;color:#fff;cursor:pointer;display:inline-block;border-bottom:1px solid transparent;transition:border-color .2s}
  .hf-title:hover{border-color:#fff}
  .hf-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:rgba(255,255,255,.82);margin-top:8px;letter-spacing:.02em}
  .hf-meta .sc{color:#ffcf52}

  .seclabel{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--fg);padding-bottom:10px;margin:38px 0 26px;flex-wrap:wrap}
  .seclabel .t{font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:500}
  .seclabel .c{font-size:11px;color:var(--sub);letter-spacing:.1em}
  .seclabel .sp{flex:1;min-width:20px}
  .tools{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .selw{position:relative}
  .selw select{appearance:none;background:none;border:none;font-family:var(--f);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sub);cursor:pointer;outline:none;padding-right:16px}
  .selw select option{background:var(--bg);color:var(--fg)}
  .selw::after{content:"";position:absolute;right:2px;top:46%;width:5px;height:5px;border-right:1px solid var(--sub);border-bottom:1px solid var(--sub);transform:translateY(-50%) rotate(45deg);pointer-events:none}
  .srch{position:relative}
  .srch input{border:none;border-bottom:1px solid var(--line);background:none;color:var(--fg);font-family:var(--f);font-size:12px;padding:4px 2px 4px 18px;outline:none;width:120px;transition:border-color .2s,width .2s}
  .srch input:focus{border-color:var(--fg);width:170px}
  .srch svg{position:absolute;left:0;top:50%;transform:translateY(-50%);width:12px;height:12px;stroke:var(--sub);fill:none;stroke-width:1.8}
  .rand{background:none;border:none;font-family:var(--f);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sub);cursor:pointer}
  .rand:hover{color:var(--fg)}

  .card .rank{font-size:11px;letter-spacing:.1em;color:var(--sub);margin-bottom:8px}
  .card .rank b{color:var(--fg);font-size:13px}
  .canon-empty{color:var(--sub);font-size:.92rem;line-height:2;padding:50px 0 80px;letter-spacing:.02em}

  #grid.dim .card:not(.match){opacity:.14;pointer-events:none}
  .gsec{margin-bottom:8px}
  .gsec .seclabel{margin:30px 0 22px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(162px,1fr));gap:38px 22px}
  .card{cursor:pointer}
  .po{position:relative;aspect-ratio:2/3;background:var(--line2);overflow:hidden}
  .po-img{width:100%;height:100%;background-size:cover;background-position:center;transition:transform .6s cubic-bezier(.2,1,.3,1)}
  .card:hover .po-img{transform:scale(1.04)}
  .po.ph{display:flex;align-items:center;justify-content:center;padding:14px}
  .po.ph span{font-size:.78rem;color:var(--sub);text-align:center;line-height:1.4}
  .po-prov{position:absolute;left:8px;bottom:8px;display:flex;gap:3px}
  .po-prov img{width:22px;height:22px;border-radius:4px;border:1px solid rgba(255,255,255,.5)}
  .cap{padding-top:12px}
  .cap .ti{font-size:.82rem;font-weight:500;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cap .mt{font-size:.68rem;color:var(--sub);margin-top:5px;letter-spacing:.04em;display:flex;gap:8px}
  .cap .mt .sc{color:var(--fg)}

  footer{border-top:1px solid var(--line);margin-top:64px;padding:28px 0 64px;font-size:11px;letter-spacing:.08em;color:var(--dim);display:flex;gap:18px;flex-wrap:wrap}
  footer a:hover{color:var(--fg)}

  /* stats */
  #stats-view{display:none}
  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--fg);margin-bottom:14px}
  .stat-card{padding:28px 22px;border-right:1px solid var(--line)}.stat-card:last-child{border-right:none}
  .stat-label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--sub);margin-bottom:14px}
  .stat-number{font-weight:700;font-size:2.6rem;line-height:.9}
  .stat-desc{font-size:11px;color:var(--sub);margin-top:10px;letter-spacing:.04em}
  .chart-section{border:1px solid var(--fg);border-top:none;padding:28px 22px}
  .chart-title{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--sub);margin-bottom:20px}
  .bar-row{display:grid;grid-template-columns:7rem 1fr 2.4rem;gap:12px;align-items:center;margin-bottom:12px}
  .bar-label{font-size:.78rem}.bar-track{height:2px;background:var(--line);position:relative}.bar-fill{position:absolute;inset:0 auto 0 0;background:var(--fg);width:0;transition:width .9s cubic-bezier(.2,1,.3,1)}
  .bar-count{font-size:.68rem;color:var(--sub);text-align:right}

  /* ── MODAL (white / DOUBLET) ── */
  .i-modal{display:none;position:fixed;inset:0;z-index:2000;background:var(--bg);overflow-y:auto}
  .i-modal-bg{display:none}
  .i-modal-content{position:relative;z-index:10;max-width:1040px;margin:0 auto;padding:clamp(56px,8vw,90px) clamp(16px,4vw,48px) 100px}
  .i-close{position:fixed;top:20px;right:clamp(16px,4vw,40px);z-index:100;width:42px;height:42px;border:1px solid var(--fg);background:var(--bg);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--fg);font-size:1.3rem;cursor:pointer;transition:transform .3s}
  .i-close:hover{transform:rotate(90deg)}
  .i-theater-zone{position:relative;margin-bottom:34px}
  .i-video-wrap{width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;position:relative}
  .i-poster-view{width:100%;height:100%;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;cursor:pointer;position:absolute;inset:0;z-index:2;filter:brightness(.62);transition:filter .4s}
  .i-poster-view:hover{filter:brightness(.78)}
  .play-ring{width:72px;height:72px;border:2px solid #fff;border-radius:50%;position:relative;background:rgba(0,0,0,.3);backdrop-filter:blur(4px)}
  .play-ring::after{content:'';position:absolute;top:50%;left:56%;transform:translate(-50%,-50%);border-left:20px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent}
  .i-player{position:absolute;inset:0;z-index:1;background:#000}.i-player iframe{width:100%;height:100%;border:none}
  .theater-btn{position:absolute;bottom:12px;right:14px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.3);color:#fff;padding:5px 12px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;z-index:20}
  .theater-btn:hover{background:#000}
  .i-story-zone{}
  .i-huge-title{font-weight:700;font-size:clamp(1.9rem,4.5vw,3rem);line-height:1.12;margin-bottom:12px;letter-spacing:-.01em}
  .i-line{display:none}
  .i-action-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:8px}
  #i-meta{font-size:.84rem;color:var(--sub);letter-spacing:.02em;flex:1;min-width:200px}
  .director-link{cursor:pointer;color:var(--fg);border-bottom:1px solid var(--line)}
  .director-link:hover{border-color:var(--fg)}
  .share-btn{background:none;border:1px solid var(--fg);color:var(--fg);padding:9px 18px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:all .2s;font-family:var(--f)}
  .share-btn:hover{background:var(--fg);color:var(--bg)}
  .watched-btn{background:var(--fg);border:1px solid var(--fg);color:var(--bg);padding:9px 18px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;font-family:var(--f)}
  .watched-btn:hover{opacity:.82}
  .watch-panel{margin-top:18px;padding:24px;border:1px solid var(--line)}
  .wp-label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--sub);margin-bottom:14px}
  .hs-wrap{display:flex;gap:8px;margin-bottom:10px}
  .hs-pos{position:relative;font-size:2.4rem;cursor:pointer;user-select:none;line-height:1}
  .hs-glyph{color:var(--line);display:block}
  .hs-pos.hs-full .hs-glyph{color:var(--fg)}
  .hs-pos.hs-half .hs-glyph{background:linear-gradient(90deg,var(--fg) 50%,var(--line) 50%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .hs-l,.hs-r{position:absolute;top:0;height:100%;width:50%;z-index:1}.hs-l{left:0}.hs-r{right:0}
  .hs-val{font-size:.9rem;color:var(--sub);margin-bottom:18px}
  .wp-textarea{width:100%;border:1px solid var(--line);background:none;color:var(--fg);font-family:var(--f);font-size:.9rem;padding:12px;resize:vertical;outline:none;margin-bottom:14px;line-height:1.7}
  .wp-textarea:focus{border-color:var(--fg)}
  .wp-btns{display:flex;gap:10px}
  .wp-confirm{background:var(--fg);border:none;color:var(--bg);padding:12px 22px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;font-family:var(--f);flex:1}
  .wp-cancel{background:none;border:1px solid var(--line);color:var(--sub);padding:12px 18px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;font-family:var(--f)}
  .wp-cancel:hover{border-color:var(--fg);color:var(--fg)}

  .cinema-ticket{margin:24px 0}
  .spec{border-top:1px solid var(--fg)}
  .spec .row{display:grid;grid-template-columns:7rem 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
  .spec dt{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--sub);padding-top:3px}
  .spec dd{font-size:.9rem}

  .i-tabs{display:flex;gap:26px;border-bottom:1px solid var(--fg);margin:40px 0 26px;flex-wrap:wrap}
  .i-tab-btn{background:none;border:none;color:var(--sub);font-family:var(--f);font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:0 0 12px;cursor:pointer;position:relative}
  .i-tab-btn.active{color:var(--fg)}.i-tab-btn.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--fg)}
  .i-body-text{font-size:1rem;line-height:2;max-width:42rem;color:var(--fg)}
  .filmarks-review{margin-top:28px;padding:22px;border:1px solid var(--line)}
  .filmarks-review-label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--sub);margin-bottom:12px}
  .filmarks-review-score{font-size:1rem;font-weight:700}
  .filmarks-review-text{font-size:.95rem;line-height:1.9;margin-top:10px;color:var(--fg)}
  .filmarks-link{display:inline-block;margin-top:12px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--sub);border-bottom:1px solid var(--line)}
  .filmarks-link:hover{color:var(--fg);border-color:var(--fg)}
  .wtw-section{margin-bottom:26px;padding-bottom:4px}
  .wtw-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .wtw-label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--sub)}
  .wtw-refresh{background:none;border:1px solid var(--line);color:var(--sub);padding:3px 9px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
  .wtw-refresh:hover{border-color:var(--fg);color:var(--fg)}
  .wtw-logos{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .provider-item{display:flex;flex-direction:column;align-items:center;gap:5px}
  .provider-logo-wrap{width:46px;height:46px;overflow:hidden;background:var(--line2);border:1px solid var(--line)}
  .provider-logo{width:100%;height:100%;object-fit:cover}
  .provider-name{font-size:9px;color:var(--sub);text-align:center;max-width:56px}
  .wtw-none{font-size:.78rem;color:var(--dim)}
  .cast-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:18px}
  .cast-item{text-align:left}
  .cast-photo{aspect-ratio:2/3;background-size:cover;background-position:center;background-color:var(--line2);margin-bottom:8px}
  .cast-name{font-size:.74rem;line-height:1.3}.cast-char{font-size:.6rem;color:var(--sub);margin-top:2px}
  .cast-loading{color:var(--dim);font-size:.75rem;letter-spacing:.1em;padding:16px 0}
  .rec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:18px}
  .rec-poster{aspect-ratio:2/3;background-size:cover;background-position:center;background-color:var(--line2);margin-bottom:8px}
  .rec-title{font-size:.76rem;line-height:1.3}.rec-year{font-size:.6rem;color:var(--sub);margin-top:2px}
  .rating-section{padding:24px;border:1px solid var(--line)}
  .rating-label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--sub);margin-bottom:14px}
  .star-rating{display:flex;gap:8px;margin-bottom:20px}
  .star{font-size:1.8rem;cursor:pointer;color:var(--line);user-select:none;transition:color .15s}.star.active{color:var(--fg)}
  .memo-input{width:100%;border:1px solid var(--line);background:none;color:var(--fg);font-family:var(--f);font-size:.9rem;padding:12px;resize:none;outline:none;line-height:1.7}
  .memo-input:focus{border-color:var(--fg)}
  .save-memo-btn{margin-top:12px;background:none;border:1px solid var(--fg);color:var(--fg);padding:10px 24px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;font-family:var(--f);display:none}
  .save-memo-btn:hover{background:var(--fg);color:var(--bg)}
  .i-back-btn{margin-top:48px;background:none;border:1px solid var(--line);color:var(--sub);padding:14px 36px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;font-family:var(--f)}
  .i-back-btn:hover{border-color:var(--fg);color:var(--fg)}
  #admin-indicator{position:fixed;bottom:18px;right:18px;font-size:10px;letter-spacing:.2em;color:var(--fg);opacity:0;transition:opacity .4s;pointer-events:none;z-index:3000}
  #admin-indicator.visible{opacity:1}

  /* director panel */
  #director-panel{position:fixed;top:0;right:0;width:340px;max-width:92vw;height:100vh;background:var(--bg);border-left:1px solid var(--line);z-index:3000;transform:translateX(100%);transition:transform .4s cubic-bezier(.2,1,.3,1);overflow-y:auto;padding:30px 24px}
  #director-panel.open{transform:translateX(0)}
  .dir-panel-close{position:absolute;top:20px;right:20px;background:none;border:none;color:var(--sub);font-size:1.4rem;cursor:pointer}.dir-panel-close:hover{color:var(--fg)}
  .dir-panel-name{font-weight:700;font-size:1.4rem;margin:28px 0 6px}
  .dir-panel-label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--sub);margin-bottom:16px}
  .dir-film-list{display:flex;flex-direction:column;gap:10px}
  .dir-film-item{display:flex;gap:12px;align-items:center;padding:8px;border:1px solid var(--line)}
  .dir-film-poster{width:40px;height:60px;background-size:cover;background-position:center;background-color:var(--line2);flex-shrink:0}
  .dir-film-title{font-size:.78rem;line-height:1.3}.dir-film-year{font-size:.65rem;color:var(--sub);margin-top:3px}
  #director-overlay{position:fixed;inset:0;z-index:2999;background:rgba(0,0,0,.3);display:none}

  @media(max-width:720px){.stats-grid{grid-template-columns:repeat(2,1fr)}.hd nav{gap:14px}}
  @media(max-width:460px){.grid{grid-template-columns:repeat(2,1fr);gap:26px 14px}}
</style>
</head>
<body>
<div id="admin-indicator"></div>

<header><div class="hd">
  <span class="logo">drop off</span>
  <nav>
    <button class="t-btn on" data-v="watched" onclick="switchView('watched',this)">Watched</button>
    <button class="t-btn" data-v="towatch" onclick="switchView('towatch',this)">To See</button>
    <button class="t-btn" data-v="canon" onclick="switchView('canon',this)">The Canon</button>
    <button class="t-btn" data-v="stats" onclick="switchView('stats',this)">Stats</button>
    <button id="themeBtn" onclick="toggleTheme()">◐ Theme</button>
    <button onclick="location.href='/'">Diary</button>
  </nav>
</div></header>

<section id="hero" class="hero">
  <div id="hero-bg"></div>
  <div id="hero-bg2"></div>
  <div class="hero-scrim"></div>
  <div class="hero-inner">
    <div class="k">Cinematic Archive</div>
    <h1 class="hero-mark">drop off</h1>
    <div id="hero-feature"></div>
  </div>
</section>

<div class="wrap">
  <div id="main">
    <div class="seclabel">
      <span class="t" id="secT">Watched</span><span class="c" id="secC"></span>
      <span class="sp"></span>
      <div class="tools">
        <button class="rand" onclick="pickRandom()">⚄ Random</button>

<script>
const API_KEY = 'c6dc0382ae920c2cb5143ff6a7ce97e6';
let allMovies = [];
let activeMovie = null;
let currentRating = 0;
let currentTab = 'watched';
let reviews = JSON.parse(localStorage.getItem('o24-reviews') || '{}');
let statusOverrides = JSON.parse(localStorage.getItem('o24-overrides') || '{}');
let theaterMode = false;
let watchProvidersCache = JSON.parse(localStorage.getItem('o24-providers') || '{}');
let adminMode = localStorage.getItem('o24-admin')==='1';
let watchRating = 0;
const PROVIDERS_TTL = 86400000;
const SHEETS_WEBHOOK = 'https://script.google.com/macros/s/AKfycbwDjSst8WOi8S7-LqMVex5UL2uDxJkcwXb7Amh37_RItMIfcl3UnDiLKkQ_Ba-7V8L9vQ/exec';
const TMDB_GENRE_MAP = {28:'アクション',12:'アドベンチャー',16:'アニメーション',35:'コメディ',80:'犯罪',99:'ドキュメンタリー',18:'ドラマ',10751:'ファミリー',14:'ファンタジー',36:'歴史',27:'ホラー',10402:'音楽',9648:'ミステリー',10749:'ロマンス',878:'SF',53:'スリラー',10752:'戦争',37:'西部劇'};
const $ = id => document.getElementById(id);
const posterURL = m => m.poster_path ? `https://image.tmdb.org/t/p/w500${m.poster_path}` : '';

// ── Watch Providers ──
async function fetchWatchProviders(movieId, forceRefresh=false){
  const now=Date.now(), cached=watchProvidersCache[movieId];
  if(!forceRefresh && cached && (now-cached.ts)<PROVIDERS_TTL) return cached.providers;
  try{
    const r=await fetch(`https://api.themoviedb.org/3/movie/${movieId}/watch/providers?api_key=${API_KEY}`);
    const d=await r.json();
    const jp=d.results?.JP||{};
    const seen={}, providers=[];
    ['flatrate','free','ads','rent','buy'].forEach(k=>(jp[k]||[]).forEach(p=>{if(!seen[p.provider_id]){seen[p.provider_id]=1;providers.push({id:p.provider_id,name:p.provider_name,logo:p.logo_path});}}));
    watchProvidersCache[movieId]={ts:now,providers};
    localStorage.setItem('o24-providers',JSON.stringify(watchProvidersCache));
    return providers;
  }catch(e){return cached?cached.providers:[];}
}
function providerLogosHtml(providers){
  if(!providers.length) return '<div class="wtw-none">配信情報が見つかりませんでした</div>';
  return providers.slice(0,12).map(p=>`<div class="provider-item"><div class="provider-logo-wrap"><img class="provider-logo" src="https://image.tmdb.org/t/p/original${p.logo}" alt="${p.name}" loading="lazy"></div><div class="provider-name">${p.name}</div></div>`).join('');
}
function providerIconsHtml(providers){
  if(!providers || !providers.length) return '';
  return providers.slice(0,4).map(p=>`<img class="po-prov-ic" src="https://image.tmdb.org/t/p/original${p.logo}" alt="${p.name}" title="${p.name}" loading="lazy">`).join('');
}
async function loadWatchProviders(movie){
  const box=$('where-to-watch');
  if(effectiveStatus(movie)!=='towatch'){ box.innerHTML=''; return; }
  box.innerHTML=`<div class="wtw-section"><div class="wtw-header"><div class="wtw-label">Where to Watch</div></div><div class="wtw-logos"><div class="wtw-none">読み込み中...</div></div></div>`;
  const providers=await fetchWatchProviders(movie.id);
  box.innerHTML=`<div class="wtw-section"><div class="wtw-header"><div class="wtw-label">Where to Watch</div><button class="wtw-refresh" onclick="refreshProviders(${movie.id})">↻ 更新</button></div><div class="wtw-logos">${providerLogosHtml(providers)}</div></div>`;
}
async function refreshProviders(id){ const m=allMovies.find(x=>x.id===id); if(m){ await fetchWatchProviders(id,true); loadWatchProviders(m);} }
async function prefetchProviders(){
  const towatch=allMovies.filter(m=>effectiveStatus(m)==='towatch').slice(0,40);
  for(const m of towatch){ const p=await fetchWatchProviders(m.id); const card=document.querySelector(`[data-mid="${m.id}"] .po-prov`); if(card) card.innerHTML=providerIconsHtml(p); }
}

// ── Data load (Notion同期 movies_watched.json) ──
async function loadData(){
  const t=Date.now();
  try{
    const r=await fetch('./movies_watched.json?t='+t);
    if(r.ok){ const movies=await r.json(); movies.forEach(m=>allMovies.push(m)); }
  }catch(e){ console.error('データ読み込み失敗',e); }
  allMovies.forEach((m,i)=>m._ord=i);
  // 自分のレビュー(localStorage)を表示に即オーバーレイ（書いたら即出る）
  allMovies.forEach(m=>{ const r=reviews[m.id]; if(r){ if(r.rating) m.filmarksScore=String(r.rating); if(r.memo) m.filmarksComment=r.memo; } });
  const missing=allMovies.filter(m=>!m.id||m.id===0||!m.poster_path);
  await Promise.allSettled(missing.map(backfillMovieFromTMDB));
  if(currentTab==='stats') renderStats(); else renderAll();
  renderHero();
  if(window._openMovieId){ const m=allMovies.find(m=>m.id===window._openMovieId); if(m) openImmersive(m); }
  prefetchProviders();
}
function cleanTitleForSearch(t){
  return String(t||'').replace(/[【\[（(].*?[】\]）)]/g,'').replace(/(4K)?\s*デジタル(・)?リマスター(版)?/g,'').replace(/修復版|完全版|特別篇|特別版|劇場版|オリジナル(・)?バージョン|ディレクターズ(・)?カット|公開\s*\d+\s*周年記念版|\d+周年記念版/g,'').replace(/\s+/g,' ').trim();
}
async function backfillMovieFromTMDB(m){
  const q=cleanTitleForSearch(m.title)||m.title; if(!q) return;
  try{
    const yr=m.year||m.filmarksYear||'';
    const url=`https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&language=ja-JP&query=${encodeURIComponent(q)}`+(yr?`&primary_release_year=${yr}`:'');
    const r=await fetch(url); const d=await r.json(); const hit=(d.results&&d.results[0])||null;
    if(hit){ if(!m.id||m.id===0)m.id=hit.id; if(!m.poster_path)m.poster_path=hit.poster_path||''; if(!m.backdrop_path)m.backdrop_path=hit.backdrop_path||m.poster_path||''; if(!m.overview)m.overview=hit.overview||''; }
  }catch(e){}
}
function effectiveStatus(movie){ return statusOverrides[movie.id]||movie.appStatus; }

// ── ヒーロー（今日の一本）: THE CANON→★5.0→上位 からランダム ──
function pickFeatured(mode){
  const img=m=>m.backdrop_path||m.poster_path;
  if(mode==='towatch'){
    const p=allMovies.filter(m=>effectiveStatus(m)==='towatch' && img(m));
    return p.length? p[Math.floor(Math.random()*p.length)] : null;
  }
  let pool=allMovies.filter(m=>m.best100 && effectiveStatus(m)==='watched' && img(m));
  if(!pool.length) pool=allMovies.filter(m=>effectiveStatus(m)==='watched' && (parseFloat(m.filmarksScore)||0)>=5 && img(m));
  if(!pool.length) pool=allMovies.filter(m=>effectiveStatus(m)==='watched' && img(m)).sort((a,b)=>(parseFloat(b.filmarksScore)||0)-(parseFloat(a.filmarksScore)||0)).slice(0,40);
  return pool.length? pool[Math.floor(Math.random()*pool.length)] : null;
}
// その映画の「有名な場面」＝TMDBのbackdrops（複数シーン）を取得
async function heroScenes(m){
  try{
    const d=await (await fetch(`https://api.themoviedb.org/3/movie/${m.id}/images?api_key=${API_KEY}`)).json();
    const bd=(d.backdrops||[]).slice().sort((a,b)=>((a.iso_639_1?1:0)-(b.iso_639_1?1:0))||((b.vote_average||0)-(a.vote_average||0)));
    const urls=bd.slice(0,6).map(x=>'https://image.tmdb.org/t/p/original'+x.file_path);
    if(urls.length) return urls;
  }catch(e){}
  const f=m.backdrop_path||m.poster_path;
  return f?['https://image.tmdb.org/t/p/original'+f]:[];
}
function heroFeature(m, towatch){
  const sc=towatch?'':(m.filmarksScore?`<span class="sc">★ ${parseFloat(m.filmarksScore).toFixed(1)}</span>`:'');
  const label=towatch?'Next Up · 次に観る →':'Now Showing · レビューを読む →';
  $('hero-feature').innerHTML=`<div class="hf-label">${label}</div><div class="hf-title">${m.title}</div><div class="hf-meta"><span>${m.year||''}</span>${m.appDirector?`<span>${m.appDirector}</span>`:''}${sc}</div>`;
}
function openReview(m){
  openImmersive(m);
  if(effectiveStatus(m)==='watched'){ const b=$('review-tab-btn'); if(b){ b.style.display=''; switchModalTab('review',b); } }
}
function renderHero(){
  const hero=$('hero'); if(!hero) return;
  if(window._heroTimer){ clearInterval(window._heroTimer); window._heroTimer=null; }
  if(currentTab==='stats'){ hero.classList.remove('has-image'); hero.onclick=null; $('hero-bg').classList.remove('on'); $('hero-bg2').classList.remove('on'); return; }
  const mode=currentTab==='towatch'?'towatch':'watched';
  const m=pickFeatured(mode); if(!m){ hero.classList.remove('has-image'); hero.onclick=null; return; }
  heroFeature(m, mode==='towatch');
  hero.onclick = mode==='towatch' ? (()=>openImmersive(m)) : (()=>openReview(m));
  heroScenes(m).then(urls=>{
    if(!urls.length){ hero.classList.remove('has-image'); return; }
    const layers=[$('hero-bg'),$('hero-bg2')]; let cur=0, idx=0;
    const show=url=>{ const pre=new Image(); pre.onload=()=>{ const next=layers[1-cur]; next.style.backgroundImage="url('"+url+"')"; next.classList.add('on'); layers[cur].classList.remove('on'); cur=1-cur; hero.classList.add('has-image'); }; pre.onerror=()=>{}; pre.src=url; };
    show(urls[0]);
    const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
    if(!reduce && urls.length>1){ window._heroTimer=setInterval(()=>{ idx=(idx+1)%urls.length; show(urls[idx]); },5000); }
  });
}

// ── Filter / sort / render ──
function getFilteredSorted(status){
  const search=$('search-input').value.toLowerCase().trim();
  const sortBy=$('sort-by').value;
  let list=allMovies.filter(m=>effectiveStatus(m)===status);
  if(search) list=list.filter(m=>(m.title||'').toLowerCase().includes(search)||(m.appDirector||'').toLowerCase().includes(search));
  if(sortBy==='random') list.sort(()=>Math.random()-0.5);
  else if(sortBy==='year-desc') list.sort((a,b)=>(b.year||'0').localeCompare(a.year||'0'));
  else if(sortBy==='year-asc') list.sort((a,b)=>(a.year||'0').localeCompare(b.year||'0'));
  else if(sortBy==='title') list.sort((a,b)=>(a.title||'').localeCompare(b.title||'','ja'));
  else if(sortBy==='score-desc') list.sort((a,b)=>(parseFloat(b.filmarksScore)||0)-(parseFloat(a.filmarksScore)||0));
  else if(sortBy==='score-asc') list.sort((a,b)=>(parseFloat(a.filmarksScore)||0)-(parseFloat(b.filmarksScore)||0));
  else if(sortBy==='added') list.sort((a,b)=>{const da=a.added||'',db=b.added||'';if(da&&db&&da!==db)return db.localeCompare(da);if(da&&!db)return -1;if(db&&!da)return 1;return (b._ord||0)-(a._ord||0);});
  return list;
}
const FKEY={
  genre:  m=>((m.appGenre||'').split(/[,、\/]/)[0]||'').trim()||'その他',
  director:m=>((m.appDirector||'').trim())||'監督 不明',
  decade: m=>{const y=parseInt(m.year);return isNaN(y)?'年代不明':(Math.floor(y/10)*10)+'s';},
  country:m=>((m.appCountry||'').split(/[,、\/]/)[0]||'').trim()||'国 不明',
  score:  m=>{const s=parseFloat(m.filmarksScore)||0;if(!s)return '未評価';if(s>=5)return '★5.0';if(s>=4)return '★4.0 – 4.5';if(s>=3)return '★3.0 – 3.5';if(s>=2)return '★2.0 – 2.5';return '★1.0 – 1.5';}
};
const SCORE_ORDER=['★5.0','★4.0 – 4.5','★3.0 – 3.5','★2.0 – 2.5','★1.0 – 1.5','未評価'];
function cardHTML(m){
  const status=effectiveStatus(m);
  const poster=posterURL(m);
  const po=poster?`<div class="po"><div class="po-img" style="background-image:url('${poster}')"></div><div class="po-prov">${status==='towatch'?providerIconsHtml(watchProvidersCache[m.id]?.providers):''}</div></div>`
                 :`<div class="po ph"><span>${m.title}</span></div>`;
  const sc=m.filmarksScore?`<span class="sc">★ ${parseFloat(m.filmarksScore).toFixed(1)}</span>`:(status==='towatch'?`<span class="sc">TO SEE</span>`:'');
  return `${po}<div class="cap"><div class="ti">${m.title}</div><div class="mt"><span>${m.year||'—'}</span>${sc}</div></div>`;
}
function makeCard(m){
  const c=document.createElement('div'); c.className='card'; c.dataset.mid=m.id;
  c.innerHTML=cardHTML(m); c.onclick=()=>openImmersive(m); return c;
}
function renderAll(){
  if(currentTab==='stats') return;
  const grid=$('grid'); grid.innerHTML='';
  const tools=document.querySelector('.tools');
  // THE CANON（Notionでキュレーションした生涯ベスト100）
  if(currentTab==='canon'){
    if(tools) tools.style.display='none';
    const list=allMovies.filter(m=>m.best100).sort((a,b)=>(parseFloat(b.filmarksScore)||0)-(parseFloat(a.filmarksScore)||0));
    $('secT').textContent='The Canon';
    $('secC').textContent=list.length+' / 100';
    if(!list.length){ grid.innerHTML='<div class="canon-empty">生涯ベスト100、選定中。<br>Notion の「ベスト100」にチェックした作品が、ここに刻まれていく。</div>'; return; }
    const g=document.createElement('div'); g.className='grid';
    list.forEach((m,i)=>{ const c=makeCard(m); const r=document.createElement('div'); r.className='rank'; r.innerHTML=`<b>${String(i+1).padStart(2,'0')}</b>`; c.insertBefore(r,c.firstChild); g.appendChild(c); });
    grid.appendChild(g);
    return;
  }
  if(tools) tools.style.display='';
  const facet=$('facet').value;
  const list=getFilteredSorted(currentTab);
  if(facet==='flat'){
    const g=document.createElement('div'); g.className='grid';
    list.forEach(m=>g.appendChild(makeCard(m))); grid.appendChild(g);
  }else{
    const key=FKEY[facet], groups={};
    list.forEach(m=>{const k=key(m);(groups[k]=groups[k]||[]).push(m);});
    let keys=Object.keys(groups);
    if(facet==='decade')keys.sort((a,b)=>((a==='年代不明')-(b==='年代不明'))||(parseInt(b)-parseInt(a)));
    else if(facet==='score')keys.sort((a,b)=>SCORE_ORDER.indexOf(a)-SCORE_ORDER.indexOf(b));
    else keys.sort((a,b)=>groups[b].length-groups[a].length);
    keys.forEach(k=>{
      const sec=document.createElement('div'); sec.className='gsec';
      sec.innerHTML=`<div class="seclabel"><span class="t">${k}</span><span class="c">${groups[k].length} titles</span></div>`;
      const g=document.createElement('div'); g.className='grid';
      groups[k].forEach(m=>g.appendChild(makeCard(m))); sec.appendChild(g); grid.appendChild(sec);
    });
  }
  $('secC').textContent=list.length+' titles';
  prefetchProviders();
}
function applyFilters(){ renderAll(); }
function pickRandom(){
  const pool=allMovies.filter(m=>effectiveStatus(m)==='towatch'); if(!pool.length) return;
  const m=pool[Math.floor(Math.random()*pool.length)];
  switchView('towatch',document.querySelector('[data-v="towatch"]'));
  setTimeout(()=>openImmersive(m),80);
}
function switchView(type,btn){
  currentTab=type;
  document.querySelectorAll('.t-btn').forEach(b=>b.classList.remove('on'));
  if(btn) btn.classList.add('on');
  if(type==='stats'){ $('main').style.display='none'; $('stats-view').style.display='block'; renderStats(); }
  else{ $('main').style.display='block'; $('stats-view').style.display='none'; $('secT').textContent=type==='towatch'?'To See':'Watched'; renderAll(); }
  renderHero();
}
const THEMES=[['paper','Paper'],['ink','Ink'],['cream','Cream'],['noir','Noir'],['sea','Deep Sea'],['dusk','Dusk']];
function applyTheme(name){ if(!THEMES.some(t=>t[0]===name)) name='paper'; document.body.setAttribute('data-theme',name);
  const label=(THEMES.find(t=>t[0]===name)||THEMES[0])[1]; const b=document.getElementById('themeBtn'); if(b) b.textContent='◐ '+label;
  try{ localStorage.setItem('o24-theme',name); }catch(e){} }
function toggleTheme(){ const cur=document.body.getAttribute('data-theme')||'paper'; const i=THEMES.findIndex(t=>t[0]===cur); applyTheme(THEMES[(i+1)%THEMES.length][0]); }

// ── Modal ──
function openImmersive(movie){
  activeMovie=movie;
  const status=effectiveStatus(movie);
  const backdrop=movie.backdrop_path||movie.poster_path;
  $('i-placeholder').style.backgroundImage=`url('https://image.tmdb.org/t/p/original${backdrop}')`;
  $('i-title').textContent=movie.title;
  const metaParts=[movie.year,movie.appCountry,movie.appGenre];
  let metaHtml=metaParts.filter(Boolean).join(' / ');
  if(movie.appDirector) metaHtml+=` / <span class="director-link" onclick="openDirectorPanel('${(movie.appDirector||'').replace(/'/g,"\\'")}')">DIR: ${movie.appDirector}</span>`;
  $('i-meta').innerHTML=metaHtml;
  $('watched-btn').style.display=(status==='towatch'&&adminMode)?'':'none';
  $('review-btn').style.display=(status==='watched'&&adminMode)?'':'none';
  $('review-tab-btn').style.display=status==='watched'?'':'none';
  const review=reviews[movie.id]||{};
  currentRating=review.rating||0;
  $('memo-input').value=review.memo||'';
  updateStars(currentRating);
  $('save-btn').textContent='Save';
  $('save-btn').style.display=adminMode?'inline-block':'none';
  renderTicket(movie);
  const tmdbOverview=movie.overview?`<p class="i-body-text">${movie.overview}</p>`:'<p class="i-body-text" style="color:var(--dim)">あらすじ情報がありません。</p>';
  let filmarksBlock='';
  const fScore=movie.filmarksScore||'', fComment=movie.filmarksComment||'', fUrl=movie.filmarksUrl||'';
  if(fScore||fComment){
    const scoreStr=fScore?`<div class="filmarks-review-score">★ ${fScore} / 5.0</div>`:'';
    const commentStr=fComment?`<p class="filmarks-review-text">"${fComment}"</p>`:'';
    const linkStr=fUrl?`<a class="filmarks-link" href="${fUrl}" target="_blank">View on Filmarks ↗</a>`:'';
    filmarksBlock=`<div class="filmarks-review"><div class="filmarks-review-label">My Filmarks Review</div>${scoreStr}${commentStr}${linkStr}</div>`;
  }
  $('i-overview').innerHTML=tmdbOverview+filmarksBlock;
  $('i-player').classList.add('hidden'); $('i-placeholder').classList.remove('hidden'); $('i-player').innerHTML='';
  $('cast-grid').innerHTML='<div class="cast-loading">Loading cast…</div>';
  $('recs-grid').innerHTML='<div class="cast-loading">Loading…</div>';
  $('where-to-watch').innerHTML='';
  switchModalTab('overview',document.querySelector('.i-tab-btn'));
  loadWatchProviders(movie);
  theaterMode=false; $('immersive-modal').classList.remove('theater-mode');
  $('immersive-modal').style.display='block'; document.body.style.overflow='hidden'; $('immersive-modal').scrollTo(0,0);
}
function renderTicket(movie){
  const rt=movie.appRuntime?movie.appRuntime.replace('分',' min'):'—';
  $('cinema-ticket').innerHTML=`<dl class="spec">
    <div class="row"><dt>Director</dt><dd>${movie.appDirector||'—'}</dd></div>
    <div class="row"><dt>Country</dt><dd>${movie.appCountry||'—'}</dd></div>
    <div class="row"><dt>Year</dt><dd>${movie.year||'—'}</dd></div>
    <div class="row"><dt>Runtime</dt><dd>${rt}</dd></div>
    <div class="row"><dt>Genre</dt><dd>${movie.appGenre||'—'}</dd></div>
    <div class="row"><dt>My Score</dt><dd>${movie.filmarksScore?'★ '+movie.filmarksScore:'—'}</dd></div>
  </dl>`;
}
function toggleTheater(){ theaterMode=!theaterMode; $('immersive-modal').classList.toggle('theater-mode',theaterMode); }
function shareMovie(){
  if(!activeMovie) return;
  const url=`${location.origin}${location.pathname}?id=${activeMovie.id}`;
  navigator.clipboard.writeText(url).then(()=>{ const b=document.querySelector('.share-btn'); b.textContent='✓ Copied'; setTimeout(()=>b.textContent='↗ Share',2000); }).catch(()=>{});
}
function pushToSheets(movie,score,comment,filmarksUrl){
  fetch(SHEETS_WEBHOOK,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:'o24-sheets-2026',movie:{title:movie.title||'',year:movie.filmarksYear||(movie.release_date||'').slice(0,4)||'',score:score||'',comment:comment||'',filmarksUrl:filmarksUrl||movie.filmarksUrl||'',director:movie.appDirector||'',country:movie.appCountry||'',runtime:(movie.appRuntime||'').replace('分',''),genre:movie.appGenre||'',tmdbId:movie.id||'',poster_path:movie.poster_path||''}})}).catch(()=>{});
}
function markAsWatched(){ if(!activeMovie)return; watchRating=0; updateWatchStars(); $('wp-comment').value=''; $('watch-panel').style.display='block'; $('watched-btn').style.display='none'; }
function setWR(v){ watchRating=v; updateWatchStars(); }
function updateWatchStars(){
  for(let i=1;i<=5;i++){ const el=$('hs'+i); if(!el)continue; el.classList.remove('hs-full','hs-half'); if(watchRating>=i)el.classList.add('hs-full'); else if(watchRating>=i-0.5)el.classList.add('hs-half'); }
  const v=$('hs-val'); if(v) v.textContent=watchRating>0?watchRating.toFixed(1)+' / 5.0':'— / 5.0';
}
function cancelWatchPanel(){ $('watch-panel').style.display='none'; $('watched-btn').style.display=''; }
async function confirmWatched(){
  if(!activeMovie) return;
  const comment=$('wp-comment').value.trim(), score=watchRating;
  const btn=$('wp-confirm-btn'); btn.textContent='Saving…';
  statusOverrides[activeMovie.id]='watched'; localStorage.setItem('o24-overrides',JSON.stringify(statusOverrides));
  if(score>0||comment){ reviews[activeMovie.id]={rating:score,memo:comment}; localStorage.setItem('o24-reviews',JSON.stringify(reviews)); }
  if(score>0) activeMovie.filmarksScore=String(score);
  if(comment) activeMovie.filmarksComment=comment;
  $('watch-panel').style.display='none'; $('review-tab-btn').style.display=''; renderTicket(activeMovie); renderAll();
  saveReviewRemote(activeMovie,score,comment);
  btn.textContent='Posting to Filmarks…';
  try{
    const res=await fetch('https://o24-filmarks.onrender.com/mark-movie',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:'o24-secret-2026',title:activeMovie.title,score:score>0?score:'',comment})});
    const data=await res.json();
    if(data.ok){ if(data.movieUrl){ activeMovie.filmarksUrl=data.movieUrl; reviews[activeMovie.id]=Object.assign(reviews[activeMovie.id]||{rating:score,memo:comment},{filmarksUrl:data.movieUrl}); localStorage.setItem('o24-reviews',JSON.stringify(reviews)); } pushToSheets(activeMovie,score,comment,data.movieUrl||''); }
    else pushToSheets(activeMovie,score,comment,'');
  }catch(e){ pushToSheets(activeMovie,score,comment,''); }
}
function switchModalTab(tab,btn){
  ['overview','cast','recs','review'].forEach(t=>{ $(`${t}-tab`).style.display=t===tab?'':'none'; });
  document.querySelectorAll('.i-tab-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  if(tab==='cast') loadCast();
  if(tab==='recs') loadRecs();
}
async function loadCast(){
  if(!activeMovie) return;
  try{
    const res=await fetch(`https://api.themoviedb.org/3/movie/${activeMovie.id}/credits?api_key=${API_KEY}&language=ja-JP`);
    const data=await res.json(); const cast=(data.cast||[]).slice(0,12); const grid=$('cast-grid');
    if(!cast.length){ grid.innerHTML='<div class="cast-loading">Cast info unavailable</div>'; return; }
    grid.innerHTML=cast.map(p=>`<div class="cast-item"><div class="cast-photo" style="background-image:url('${p.profile_path?`https://image.tmdb.org/t/p/w185${p.profile_path}`:''}')"></div><div class="cast-name">${p.name}</div><div class="cast-char">${p.character||''}</div></div>`).join('');
  }catch(e){}
}
async function loadRecs(){
  if(!activeMovie) return;
  try{
    const res=await fetch(`https://api.themoviedb.org/3/movie/${activeMovie.id}/recommendations?api_key=${API_KEY}&language=ja-JP`);
    const data=await res.json(); const recs=(data.results||[]).slice(0,12); const grid=$('recs-grid');
    if(!recs.length){ grid.innerHTML='<div class="cast-loading">No recommendations</div>'; return; }
    grid.innerHTML=recs.map(m=>`<div class="rec-item"><div class="rec-poster" style="background-image:url('${m.poster_path?`https://image.tmdb.org/t/p/w342${m.poster_path}`:''}')"></div><div class="rec-title">${m.title}</div><div class="rec-year">${m.release_date?m.release_date.split('-')[0]:''}</div></div>`).join('');
  }catch(e){}
}
async function openDirectorPanel(name){
  $('dir-panel-name').textContent=name; $('dir-film-list').innerHTML='<div class="cast-loading">Loading…</div>';
  $('director-panel').classList.add('open'); $('director-overlay').style.display='block';
  try{
    const s=await (await fetch(`https://api.themoviedb.org/3/search/person?api_key=${API_KEY}&query=${encodeURIComponent(name)}&language=ja-JP`)).json();
    const person=s.results?.[0]; if(!person){ $('dir-film-list').innerHTML='<div class="cast-loading">Not found</div>'; return; }
    const c=await (await fetch(`https://api.themoviedb.org/3/person/${person.id}/movie_credits?api_key=${API_KEY}&language=ja-JP`)).json();
    const films=(c.crew||[]).filter(x=>x.job==='Director').sort((a,b)=>(b.release_date||'').localeCompare(a.release_date||'')).slice(0,20);
    if(!films.length){ $('dir-film-list').innerHTML='<div class="cast-loading">No films</div>'; return; }
    $('dir-film-list').innerHTML=films.map(f=>`<div class="dir-film-item"><div class="dir-film-poster" style="background-image:url('${f.poster_path?`https://image.tmdb.org/t/p/w92${f.poster_path}`:''}')"></div><div><div class="dir-film-title">${f.title}</div><div class="dir-film-year">${f.release_date?f.release_date.split('-')[0]:'—'}</div></div></div>`).join('');
  }catch(e){}
}
function closeDirectorPanel(){ $('director-panel').classList.remove('open'); $('director-overlay').style.display='none'; }
function setRating(n){ currentRating=n; updateStars(n); }
function updateStars(n){ document.querySelectorAll('.star').forEach((s,i)=>s.classList.toggle('active',i<n)); }
function jumpToReview(){ const b=$('review-tab-btn'); if(b){ b.style.display=''; switchModalTab('review',b); } const mi=$('memo-input'); if(mi) setTimeout(()=>{try{mi.focus();}catch(e){}},60); }
// Notionへ永続化（fire-and-forget・未設定/失敗でもUIは成立）
function saveReviewRemote(m,score,comment){
  try{ fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:m.id,title:m.title,score:score||'',comment:comment||'',secret:'o24-secret-2026'})}).catch(()=>{}); }catch(e){}
}
async function saveMemo(){
  if(!activeMovie) return;
  const memo=$('memo-input').value;
  reviews[activeMovie.id]={rating:currentRating,memo}; localStorage.setItem('o24-reviews',JSON.stringify(reviews));
  // この端末では即サイトに反映
  if(currentRating>0) activeMovie.filmarksScore=String(currentRating);
  if(memo) activeMovie.filmarksComment=memo;
  renderAll();
  // Notionへ永続化（翌朝syncで公開表示にも）
  saveReviewRemote(activeMovie,currentRating,memo);
  const btn=$('save-btn');
  if(memo||currentRating>0){
    btn.textContent='Posting…';
    try{
      const res=await fetch('https://o24-filmarks.onrender.com/mark-movie',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:'o24-secret-2026',title:activeMovie.title,score:currentRating>0?currentRating:'',comment:memo})});
      const data=await res.json(); btn.textContent=data.ok?'✓ 保存＆投稿':'✓ 保存';
    }catch(e){ btn.textContent='✓ 保存'; }
  }else btn.textContent='✓ 保存';
  setTimeout(()=>btn.textContent='Save',3000);
}
async function startCinema(){
  if(!activeMovie) return;
  try{
    let video=null;
    for(const lang of ['language=ja-JP','']){
      const d=await (await fetch(`https://api.themoviedb.org/3/movie/${activeMovie.id}/videos?api_key=${API_KEY}&${lang}`)).json();
      const yt=(d.results||[]).filter(v=>v.site==='YouTube');
      video=yt.find(v=>v.type==='Trailer')||yt.find(v=>v.type==='Teaser')||yt[0]; if(video)break;
    }
    if(video){ $('i-placeholder').classList.add('hidden'); const p=$('i-player'); p.classList.remove('hidden'); p.innerHTML=`<iframe src="https://www.youtube.com/embed/${video.key}?autoplay=1&mute=0&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`; }
    else alert('予告編が見つかりませんでした。');
  }catch(e){}
}
function closeImmersive(){ $('immersive-modal').style.display='none'; document.body.style.overflow='auto'; $('i-player').innerHTML=''; theaterMode=false; }

function renderStats(){
  const watched=allMovies.filter(m=>effectiveStatus(m)==='watched');
  const towatch=allMovies.filter(m=>effectiveStatus(m)==='towatch');
  const scores=watched.map(m=>parseFloat(m.filmarksScore)).filter(n=>n>0);
  const avg=scores.length?(scores.reduce((s,n)=>s+n,0)/scores.length).toFixed(2):'—';
  const genreCount={}; allMovies.forEach(m=>{ if(m.appGenre) m.appGenre.split(/[,、]/).forEach(g=>{const t=g.trim(); if(t)genreCount[t]=(genreCount[t]||0)+1;});});
  const topGenres=Object.entries(genreCount).sort((a,b)=>b[1]-a[1]).slice(0,8); const maxG=topGenres[0]?.[1]||1;
  const decCount={}; allMovies.forEach(m=>{ if(m.year){const d=Math.floor(parseInt(m.year)/10)*10; if(!isNaN(d))decCount[d]=(decCount[d]||0)+1;}});
  const topDec=Object.entries(decCount).sort((a,b)=>b[0]-a[0]).slice(0,8); const maxD=topDec[0]?.[1]||1;
  $('stats-view').innerHTML=`
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Watched</div><div class="stat-number">${watched.length}</div><div class="stat-desc">films seen</div></div>
      <div class="stat-card"><div class="stat-label">To See</div><div class="stat-number">${towatch.length}</div><div class="stat-desc">in the list</div></div>
      <div class="stat-card"><div class="stat-label">Avg Score</div><div class="stat-number">${avg}</div><div class="stat-desc">of ${scores.length} rated</div></div>
      <div class="stat-card"><div class="stat-label">Total</div><div class="stat-number">${allMovies.length}</div><div class="stat-desc">catalogued</div></div>
    </div>
    <div class="chart-section"><div class="chart-title">Genre Distribution</div>
      ${topGenres.map(([g,c])=>`<div class="bar-row"><div class="bar-label">${g}</div><div class="bar-track"><div class="bar-fill" data-w="${(c/maxG*100).toFixed(1)}"></div></div><div class="bar-count">${c}</div></div>`).join('')}</div>
    <div class="chart-section"><div class="chart-title">Decade Distribution</div>
      ${topDec.map(([d,c])=>`<div class="bar-row"><div class="bar-label">${d}s</div><div class="bar-track"><div class="bar-fill" data-w="${(c/maxD*100).toFixed(1)}"></div></div><div class="bar-count">${c}</div></div>`).join('')}</div>`;
  requestAnimationFrame(()=>document.querySelectorAll('.bar-fill').forEach(el=>el.style.width=el.dataset.w+'%'));
}

// ── Konami admin ──
(function(){
  const K=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a']; let p=0;
  document.addEventListener('keydown',e=>{
    if(e.key===K[p]){ p++; if(p===K.length){ p=0; adminMode=!adminMode;
      localStorage.setItem('o24-admin', adminMode?'1':'0');
      $('save-btn').style.display=adminMode?'inline-block':'none';
      if(activeMovie){ const st=statusOverrides[activeMovie.id]||activeMovie.appStatus;
        if(st==='towatch'){ $('watched-btn').style.display=adminMode?'':'none'; $('watch-panel').style.display='none'; }
        if(st==='watched'){ const rb=$('review-btn'); if(rb) rb.style.display=adminMode?'':'none'; } }
      const ind=$('admin-indicator'); if(ind){ ind.textContent=adminMode?'ADMIN MODE':'ADMIN OFF'; ind.classList.add('visible'); setTimeout(()=>ind.classList.remove('visible'),2000); }
    }} else { p=e.key===K[0]?1:0; }
  });
})();

// ── init ──
(function(){ const q=new URLSearchParams(location.search).get('theme'); if(q){ applyTheme(q); return; } applyTheme(THEMES[Math.floor(Math.random()*THEMES.length)][0]); })();
const urlId=new URLSearchParams(location.search).get('id'); if(urlId) window._openMovieId=parseInt(urlId);
const _ht=(location.hash||'').replace('#','');
if(['towatch','canon','stats'].includes(_ht)){ const _b=document.querySelector(`[data-v="${_ht}"]`); if(_b) switchView(_ht,_b); }
loadData();
</script>
